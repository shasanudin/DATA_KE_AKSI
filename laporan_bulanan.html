<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NIRBITA CORE | Intelligence Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body{
background:#071A2B;
font-family:'Inter',sans-serif;
color:#fff;
}


.navbar{
background:#0b2239;
}


.brand{
font-size:24px;
font-weight:800;
color:#00ff9c;
}


.card-nirbita{

background:#102d47;
border:none;
border-radius:20px;
padding:25px;
box-shadow:
0 10px 30px rgba(0,0,0,.3);

}


.stat-number{

font-size:38px;
font-weight:800;
color:#00c2ff;

}


.score-high{

color:#ff6b6b;
font-weight:bold;

}


.table{

color:white;

}


.progress{

height:10px;

}


</style>

</head>


<body>


<nav class="navbar navbar-dark">

<div class="container">

<span class="brand">

<i class="fas fa-brain"></i>

NIRBITA CORE

</span>


<span>

Nexus Intelligence Research

</span>


</div>

</nav>



<div class="container py-4">


<div class="row g-4">


<div class="col-md-3">

<div class="card-nirbita">

<h6>
<i class="fas fa-database"></i>
DATA NODE
</h6>


<div class="stat-number" id="totalWilayah">

0

</div>


<small>
Wilayah Analisis
</small>


</div>

</div>




<div class="col-md-3">

<div class="card-nirbita">

<h6>
<i class="fas fa-chart-line"></i>
AVERAGE SCORE
</h6>


<div class="stat-number" id="avgScore">

0

</div>


<small>
NIRBITA Intelligence Score
</small>


</div>

</div>





<div class="col-md-3">

<div class="card-nirbita">

<h6>
<i class="fas fa-triangle-exclamation"></i>
PRIORITY AREA
</h6>


<div class="stat-number" id="priority">

0

</div>


<small>
Score > 70
</small>


</div>

</div>





<div class="col-md-3">

<div class="card-nirbita">

<h6>
<i class="fas fa-robot"></i>
AI ENGINE
</h6>


<div class="stat-number">

ONLINE

</div>


<small>
Mistral Ready
</small>


</div>

</div>


</div>





<div class="row mt-4">


<div class="col-md-6">


<div class="card-nirbita">


<h5>

<i class="fas fa-chart-pie"></i>

Distribusi Risiko

</h5>


<canvas id="riskChart"></canvas>


</div>


</div>




<div class="col-md-6">


<div class="card-nirbita">


<h5>

<i class="fas fa-ranking-star"></i>

Top Prioritas Wilayah

</h5>


<table class="table">

<thead>

<tr>

<th>Wilayah</th>

<th>Score</th>

</tr>

</thead>


<tbody id="rankingTable">

</tbody>


</table>



</div>


</div>


</div>



</div>





<script type="module" src="js/nirbita-core.js"></script>


</body>
</html>
